# site-review configuration for Puppy Connection.
#
# Read by the site-review skill (~/.claude/skills/site-review), which runs a full pre-launch
# review against every page, width, form, data record and editor screen. The scripts only read
# this repo, and they write everything to C:/Git_Repos/hs-review-data.
#
# PUBLIC FILE. GitHub Pages serves this repo's root, so this file is public at /review.yml on
# the concept address. Keep it to hostnames, paths and names that are already public. No
# identities, tokens, emails, prices or notes about people. The editor signs in with addresses
# from the repo's own local seed (<slug>@breeders.test), which reach no real inbox. The portal
# signs in as the seed's largest kennel, so its screens carry the most litters and puppies.

site: puppyconnection
name: Puppy Connection
review_host: https://site.puppyconnection.workers.dev
live_host: https://www.puppy-connection.com
draft: true            # noindex and a closed robots.txt are expected until cutover

# The public pages are generated by app/build/generate.mjs from the portal's public export,
# the same feed Workers Builds uses on each publish (app/build/ci-build.sh). The review fetches
# that export read-only into a throwaway copy of HEAD and builds there, never in this repo.
generated: true
build:
  command: >-
    node app/build/fetch-data.mjs https://portal.puppyconnection.workers.dev/data/export.json _review
    && node app/build/generate.mjs --data _review --out _review/site
    --base https://site.puppyconnection.workers.dev/ --portal https://portal.puppyconnection.workers.dev
  output: _review/site
  copy_exclude: [_harvest]

# The database owns the data. The review reads the four files the build fetched above, in the
# build copy, and never connects to the database.
data:
  dir: _review/data
  in_build: true
  rules:
    gallery_max: 12
    # A placed puppy stays on its own page and its litter, and never on the browsing lists.
    hide_status_on: {adopted: [puppies.html]}
  records:
    puppy:   {file: puppies.json, key: slug, name: name, page: "puppy-{slug}.html",
              fields: {status: availability, gender: sex}, values: {placed: adopted}}
    breeder: {file: breeders.json, key: slug, name: name, page: "breeder-{slug}.html",
              hide_when: {slug: unassigned}}   # listings with no breeder are never named
    breed:   {file: breeds.json, key: slug, name: name, page: "breed-{slug}.html"}

# The breeder portal and the operator admin, run on a throwaway local copy through the repo's
# own setup (app/dev/setup.mjs), which makes the .dev.vars from the tracked examples and seeds
# the local database from data/data.js. Never staging, never the staging database.
editor:
  local:
    source_repo: C:/Git_Repos/puppyconnection-website-repo
    archive: [app, data, _harvest/data]
    env:
      WRANGLER_JS: "{cache_root}/_runtime/teapup-website-repo-admin/node_modules/wrangler/bin/wrangler.js"
    # The seed leaves the launch checklist empty, so its migrations are applied to the local copy
    # too, giving the checklist drawers real items to open. Three of them fail locally and that is
    # expected (a column schema.sql already has, and rows naming sign-ins the seed does not
    # create), so the step always exits 0. On 2026-10-23 this loaded 80 items.
    setup:
      - "node app/dev/setup.mjs --reset"
      - '(for %f in (app\migrations\*checklist*.sql) do @"C:/Program Files/nodejs/node.exe" "%WRANGLER_JS%" d1 execute puppyconnection --local --persist-to app/.state --config app/portal/wrangler.jsonc --file %f) & exit /b 0'
    servers:
      - {name: portal, port: 8787, command: ["C:/Program Files/nodejs/node.exe", "{cache_root}/_runtime/teapup-website-repo-admin/node_modules/wrangler/bin/wrangler.js", dev, --config, app/portal/wrangler.jsonc, --persist-to, app/.state, --port, "8787", --ip, 127.0.0.1, --test-scheduled]}
      - {name: admin, port: 8788, command: ["C:/Program Files/nodejs/node.exe", "{cache_root}/_runtime/teapup-website-repo-admin/node_modules/wrangler/bin/wrangler.js", dev, --config, app/admin/wrangler.jsonc, --persist-to, app/.state, --port, "8788", --ip, 127.0.0.1]}
    # The repo's own journey test is the core task: sign up, approve, add a litter, puppies and
    # a photo, pay through the practice checkout, and see the puppies in the site export.
    tasks:
      - {name: breeder_journey, command: "node app/dev/e2e.mjs"}
    timeout: 10800       # editor.js limit in seconds; the 123-puppy kennel makes the portal long
    concurrency: 2
  apps:
    portal:
      url: http://localhost:8787/
      signin: {kind: emailed-link, email: peacefulpawspuppies@breeders.test, start: /auth/start, mailbox: "/dev/mail.json?to={email}", verify: /auth/verify}
      ready_selector: .rail
      menu: {toggle: .menu-btn, panel: "#nav", links: "#nav a"}
    admin:
      url: http://localhost:8788/
      ready_selector: .rail
      menu: {toggle: .menu-btn, panel: "#nav", links: "#nav a"}
  drawer: {root: "#drawer", body: .drawer-body}
  screens:
    - {app: portal, id: overview, hash: "#/"}
    - {app: portal, id: litters, hash: "#/litters"}
    - {app: portal, id: parents, hash: "#/parents"}
    - {app: portal, id: pay, hash: "#/pay"}
    - {app: portal, id: stats, hash: "#/stats"}
    - {app: portal, id: profile, hash: "#/profile"}
    - {app: portal, id: payments, hash: "#/payments"}
    - {app: portal, id: account, hash: "#/account"}
    - {app: portal, id: help, hash: "#/help"}
    - {app: admin, id: overview, hash: "#/"}
    - {app: admin, id: checklist, hash: "#/checklist"}
    - {app: admin, id: checklist-launch, hash: "#/checklist?section=launch"}
    - {app: admin, id: approvals, hash: "#/approvals"}
    - {app: admin, id: reported, hash: "#/reported"}
    - {app: admin, id: photo-review, hash: "#/photo-review"}
    - {app: admin, id: breeders, hash: "#/breeders"}
    - {app: admin, id: listings, hash: "#/listings"}
    - {app: admin, id: breeds, hash: "#/breeds"}
    - {app: admin, id: payments, hash: "#/payments"}
    - {app: admin, id: reports, hash: "#/reports"}
    - {app: admin, id: list, hash: "#/list"}
    - {app: admin, id: people, hash: "#/people"}
    - {app: admin, id: publish, hash: "#/publish"}
    - {app: admin, id: terms, hash: "#/terms"}
    - {app: admin, id: email, hash: "#/email"}
    - {app: admin, id: settings, hash: "#/settings"}
    - {app: admin, id: activity, hash: "#/activity"}
    - {app: admin, id: search, hash: "#/search?q=doodle"}
  drawers:
    - {app: portal, kind: litter, screen: litters, rows: "[data-edit-litter]", id_attr: data-edit-litter}
    - {app: portal, kind: puppy, screen: litters, rows: "[data-edit-puppy]", id_attr: data-edit-puppy}
    - {app: portal, kind: parent, screen: parents, rows: "[data-edit-parent]", id_attr: data-edit-parent}
    - {app: portal, kind: new-litter, screen: litters, action: "#add-litter"}
    - {app: portal, kind: new-puppy, screen: litters, action: "[data-add-puppy]"}
    - {app: portal, kind: add-several, screen: litters, action: "[data-add-many]"}
    - {app: portal, kind: new-parent, screen: parents, action: "[data-new-parent]"}
    - {app: admin, kind: breeder, screen: breeders, rows: "tr[data-open]", id_attr: data-open}
    - {app: admin, kind: breed, screen: breeds, rows: "tr[data-open]", id_attr: data-open}
    # The checklist opens grouped by area with every group closed, so its items are opened from
    # the launch section's list: expand the row, then its Edit, assign or comment button. Every
    # item uses the same drawer, so the launch section's items stand for the gate sections too.
    - {app: admin, kind: checklist-launch, screen: checklist-launch, rows: "button.cl-toggle", id_attr: data-item, then: 'button[data-open="{id}"]'}
    - {app: admin, kind: new-breed, screen: breeds, action: "#add-breed"}
    - {app: admin, kind: new-checklist-item, screen: checklist, action: "#cl-add"}
    - {app: admin, kind: edit-profile, screen: breeders, action: ["tr[data-open]", "#drawer #edit-profile"]}
    - {app: admin, kind: edit-litter, screen: breeders, action: ["tr[data-open]", "#drawer [data-edit-litter]"]}
    - {app: admin, kind: edit-puppy, screen: breeders, action: ["tr[data-open]", "#drawer [data-edit-puppy]"]}
    - {app: admin, kind: puppy-photos, screen: breeders, action: ["tr[data-open]", "#drawer [data-photos-puppy]"]}

# The facts the owner has given us, read by the copy review. Claims with no source here or in
# the data become questions for the owner, never fixes.
owner_facts:
  - C:/Git_Repos/puppyconnection-website-repo/_claude-state.md
  - C:/Git_Repos/puppyconnection-website-repo/app/docs/launch-workplan.md
  - C:/Git_Repos/hs-proposals/puppyconnection/2026-10-19-amber-answers.md
  - C:/Git_Repos/hs-proposals/puppyconnection/2026-10-21-amber-plan-notes.md
  - C:/Git_Repos/hs-proposals/puppyconnection/2026-10-10-amber-meeting.md
  - C:/Git_Repos/hs-proposals/puppyconnection/2026-10-16-amber-requirements.md

widths: [390, 768, 1366, 1920, 2560]
touch_widths: [390]

groups:
  - {name: puppy, match: "puppy-*.html"}
  - {name: breed, match: "breed-*.html"}
  - {name: breeder, match: "breeder-*.html"}
  - {name: guide, match: "guide-*.html"}
  - {name: state, match: "*-in-*.html"}

# Not site pages. Each is skipped on purpose and the coverage report lists it.
exclude:
  - {path: app/, reason: the portal and admin source, reviewed by the editor stage}
  - {path: _harvest/, reason: the saved Wix listings the import was built from}
  - {path: _review/, reason: the review's own fetched data}
  - {path: img/, reason: images}
  - {path: puppy.html, reason: "the concept's old query-string address, now a page that sends the visitor on"}
  - {path: breed.html, reason: "the concept's old query-string address, now a page that sends the visitor on"}
  - {path: breeder.html, reason: "the concept's old query-string address, now a page that sends the visitor on"}
