<title>Breeder Portal Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap">
<!-- The player lives in the portal (app/portal/public/walkthrough.css and walkthrough.js), so the
     review page and the panel breeders see play the same scenes. Publish it with both files. -->
<link rel="stylesheet" href="walkthrough.css">
<style>
/* Layout: one centered column, the heading over the player. The portal locks itself to light mode,
   so this page does too, with its colors set explicitly. */
:root { color-scheme: light only; }
body { background: #f5f2ea; color: #262626; font: 16px/1.5 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif; }
.page { max-width: 1040px; margin: 0 auto; display: grid; gap: 1rem; padding-block: 1.5rem 2.5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-eyebrow { margin: 0 0 .3rem; font-size: .75rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #7c6b40; }
.page h1 { margin: 0; font: 600 clamp(1.45rem, 3.4vw, 2.1rem)/1.15 'Playfair Display', Georgia, serif; text-wrap: balance; }
.page-lede { margin: .45rem 0 0; color: #414141; max-width: 65ch; }
</style>

<main class="page">
  <header>
    <p class="page-eyebrow">Puppy Connection breeder portal</p>
    <h1>From sign-in to a live listing</h1>
    <p class="page-lede">The five steps a breeder takes to list a litter, shown on the portal's own screens with a sample kennel.</p>
  </header>
  <div id="player"></div>
</main>

<script src="walkthrough.js"></script>
<script>
  PCWalkthrough.mount(document.getElementById('player'), {
    keyTarget: document,
    note: 'Sample kennel, parents and puppies, with drawn photos. Space plays or pauses, and the arrow keys move between scenes.'
  });
</script>
